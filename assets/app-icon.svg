  <circle cx="256" cy="256" r="196" fill="none" stroke="#2C2E48" stroke-opacity="0.25"
          stroke-width="8" stroke-dasharray="22 18"/>
  <g fill="#FFFFFF" stroke="#2C2E48" stroke-width="14" stroke-linejoin="round">
    <path d="M222 262 C216 306 200 336 178 358 H334 C312 336 296 306 290 262 Z"/>
    <path d="M200 236 H312 L302 264 H210 Z"/>
    <circle cx="256" cy="184" r="50"/>
    <rect x="152" y="354" width="208" height="44" rx="16"/>
  </g>
</svg>
